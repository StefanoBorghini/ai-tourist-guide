name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Valida i Territory Pack
        run: npm run packs:validate
      - name: Nessun codice specifico per territorio
        run: npm run check:no-territory-code
      - name: Build app
        run: npm run build
