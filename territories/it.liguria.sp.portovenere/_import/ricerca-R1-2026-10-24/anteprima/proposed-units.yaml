# ================================================================ Santuario delle Grazie (sottoluogo di Le Grazie)
- id: santuario-le-grazie-context-opere-it
  anchor: santuario-le-grazie
  unitType: context
  locale: it
  audience: general
  durationS: 18
  text: Secondo il Parco, la chiesa è di origine quattrocentesca e fu modificata in seguito. Il Parco attribuisce il coro ligneo a Fra Paolo da Recco, l'immagine della Madonna ad Andrea de Aste e gli affreschi del refettorio, della fine del Quattrocento, a Nicolò Corso.
  assertions:
    - sg-quattrocento
    - sg-attribuzioni
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: se il catalogo MiC conferma il XIV secolo, sg-quattrocento diventa una controversia e la prima frase va
  # riscritta. Se sg-attribuzioni viene verificata, ritirare sg-opere e aggiornare il racconto d'apertura esistente.
- id: santuario-le-grazie-context-opere-en
  anchor: santuario-le-grazie
  unitType: context
  locale: en
  audience: general
  durationS: 18
  text: According to the Park, the church dates back to the 15th century and was later altered. The Park attributes the wooden choir to Fra Paolo da Recco, the image of the Virgin to Andrea de Aste and the late 15th-century refectory frescoes to Nicolò Corso.
  assertions:
    - sg-quattrocento
    - sg-attribuzioni
  introduces: []
  requires: []
  hooks: []
- id: santuario-le-grazie-detail-privato-it
  anchor: santuario-le-grazie
  unitType: detail
  locale: it
  audience: general
  durationS: 7
  text: Il complesso fu legato ai monaci Olivetani; secondo il Parco, parte degli edifici oggi è di proprietà privata.
  assertions:
    - sg-olivetani-privato
  introduces: []
  requires: []
  hooks: []
- id: santuario-le-grazie-detail-privato-en
  anchor: santuario-le-grazie
  unitType: detail
  locale: en
  audience: general
  durationS: 8
  text: The complex was linked to the Olivetan monks; according to the Park, part of the buildings is now privately owned.
  assertions:
    - sg-olivetani-privato
  introduces: []
  requires: []
  hooks: []

# ================================================================ Le Grazie: Villa romana del Varignano (luogo principale)
# A pagamento (parte di Le Grazie). Se un giorno nasce il luogo «villa-varignano» con coordinate ufficiali, questi
# racconti vanno spostati lì.
- id: le-grazie-context-varignano-it
  anchor: le-grazie
  unitType: context
  locale: it
  audience: general
  durationS: 25
  text: Poco lontano, al Varignano Vecchio, c'è una villa romana con parte residenziale, terme, cisterna e area produttiva; il Ministero della Cultura vi indica il frantoio oleario più antico della Liguria. Le sue fasi partono dalla fine del II secolo avanti Cristo, l'impianto che si vede oggi risale al 90–80 avanti Cristo e il luogo fu frequentato fino al VI secolo dopo Cristo.
  assertions:
    - vv-complesso
    - vv-cronologia
  introduces: []
  requires: []
  hooks: []
- id: le-grazie-context-varignano-en
  anchor: le-grazie
  unitType: context
  locale: en
  audience: general
  durationS: 25
  text: Not far away, at Varignano Vecchio, there is a Roman villa with living quarters, baths, a cistern and a production area; the Ministry of Culture describes its olive press as the oldest in Liguria. Its phases go back to the late 2nd century BC, the layout you see today dates to 90–80 BC, and the site was used until the 6th century AD.
  assertions:
    - vv-complesso
    - vv-cronologia
  introduces: []
  requires: []
  hooks: []
- id: le-grazie-detail-varignano-luna-it
  anchor: le-grazie
  unitType: detail
  locale: it
  audience: general
  durationS: 9
  text: La villa faceva parte di un sistema di proprietà agricole e approdi romani del Golfo della Spezia, legato al porto di Luna.
  assertions:
    - vv-luna
  introduces: []
  requires: []
  hooks: []
- id: le-grazie-detail-varignano-luna-en
  anchor: le-grazie
  unitType: detail
  locale: en
  audience: general
  durationS: 10
  text: The villa belonged to a network of Roman farms and landing places in the Gulf of La Spezia, linked to the port of Luna.
  assertions:
    - vv-luna
  introduces: []
  requires: []
  hooks: []

