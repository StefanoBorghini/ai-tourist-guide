# ANTEPRIMA — BOZZE dei racconti (unità narrative) per le 32 affermazioni del pacchetto PV-GAIA-RESEARCH-2026-10-24-R1.
# Non importare: si creano nello Studio («Nuovo racconto», studio_create_unit) DOPO che le affermazioni citate sono
# almeno «in revisione». Un racconto che cita un'affermazione in bozza è un errore del validatore
# (UNIT_ASSERTION_NOT_NARRATABLE).
# Ogni testo dice solo ciò che dicono le affermazioni citate, con la stessa prudenza («Secondo il Parco», «si ritiene»,
# «è un'ipotesi»). Un'affermazione riscritta o respinta in revisione va tolta anche dal racconto, che va riscritto.
# Vendita (config.access di oggi): i racconti d'apertura dei luoghi principali sono gratuiti; tutti gli altri stanno
# nella parte a pagamento del loro luogo principale (Palmaria, Le Grazie, Porto Venere, Fezzano).
# Durate: 1,5–3,2 parole al secondo, come chiede il validatore.
# Le note «# REVISIONE» indicano cosa controllare nel testo se l'affermazione cambia.

# ================================================================ Porto Venere (luogo principale, introduttivo)
# Oggi «portovenere» non ha un racconto d'apertura (avviso ACCESS_INTRO_NO_OPENING): questo lo colma ed è GRATUITO.
- id: portovenere-opening-it
  anchor: portovenere
  unitType: opening
  locale: it
  audience: general
  durationS: 14
  text: Benvenuto a Porto Venere. Il borgo storico è un unico sistema di mura e porta, Castello Doria, le chiese di San Lorenzo e San Pietro e la Palazzata, la fila di case-torri sul mare.
  assertions:
    - bpv-sistema-difensivo
  introduces: []
  requires: []
  hooks: []
- id: portovenere-opening-en
  anchor: portovenere
  unitType: opening
  locale: en
  audience: general
  durationS: 14
  text: Welcome to Porto Venere. The historic village forms a single system of walls and gate, Doria Castle, the churches of San Lorenzo and San Pietro, and the Palazzata, the row of tower houses along the sea.
  assertions:
    - bpv-sistema-difensivo
  introduces: []
  requires: []
  hooks: []
- id: portovenere-context-storia-it
  anchor: portovenere
  unitType: context
  locale: it
  audience: general
  durationS: 18
  text: "Il nome è antico: secondo il Parco, «Portus Veneris» compare già nel II secolo dopo Cristo in un itinerario nautico romano, anche se la datazione è discussa. Dal 1113, ceduto dai Signori di Vezzano, il borgo passò a Genova e ne divenne un avamposto."
  assertions:
    - bpv-portus-veneris
    - bpv-genova-1113
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: «anche se la datazione è discussa» riflette la certezza «uncertain» di bpv-portus-veneris; se la fonte
  # specialistica la conferma, togliere l'inciso.
- id: portovenere-context-storia-en
  anchor: portovenere
  unitType: context
  locale: en
  audience: general
  durationS: 18
  text: "The name is old: according to the Park, 'Portus Veneris' already appears in a Roman sailing itinerary in the 2nd century AD, although the dating is debated. From 1113, ceded by the Lords of Vezzano, the village came under Genoa and became one of its outposts."
  assertions:
    - bpv-portus-veneris
    - bpv-genova-1113
  introduces: []
  requires: []
  hooks: []

