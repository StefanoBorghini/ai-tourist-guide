# ================================================================ Palmaria (luogo principale, a pagamento)
- id: palmaria-context-paesaggio-it
  anchor: palmaria
  unitType: context
  locale: it
  audience: general
  durationS: 16
  text: L'isola ha due volti. Il versante orientale scende dolcemente ed è coperto di vegetazione; quello occidentale è fatto di falesie ripide, alte fino a circa 188 metri. Nelle sue rocce calcaree l'acqua ha scavato cavità, pozzi e forme in superficie.
  assertions:
    - pa-versanti
    - pa-carsismo
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: i 188 m sono solo nel rapporto Markdown del pacchetto; se la pagina non li riporta, togliere la cifra.
- id: palmaria-context-paesaggio-en
  anchor: palmaria
  unitType: context
  locale: en
  audience: general
  durationS: 16
  text: The island has two faces. The eastern side slopes gently and is covered in vegetation; the western side is made of steep cliffs up to about 188 metres high. In its limestone rocks, water has carved cavities, shafts and surface forms.
  assertions:
    - pa-versanti
    - pa-carsismo
  introduces: []
  requires: []
  hooks: []
- id: palmaria-curiosity-nome-it
  anchor: palmaria
  unitType: curiosity
  locale: it
  audience: general
  durationS: 8
  text: Le palme c'entrano poco. Il Parco propone che il nome Palmaria derivi da «balma», antica parola per grotta; è un'ipotesi etimologica.
  assertions:
    - pa-nome-balma
  introduces: []
  requires: []
  hooks: []
- id: palmaria-curiosity-nome-en
  anchor: palmaria
  unitType: curiosity
  locale: en
  audience: general
  durationS: 12
  text: "The palms may have little to do with it. The Park suggests that the name Palmaria comes from 'balma', an old word for cave; it is an etymological hypothesis."
  assertions:
    - pa-nome-balma
  introduces: []
  requires: []
  hooks: []
- id: palmaria-context-portoro-it
  anchor: palmaria
  unitType: context
  locale: it
  audience: general
  durationS: 24
  text: Da queste rocce viene il portoro, chiamato tradizionalmente marmo ma in realtà un calcare nero con venature giallo-dorate. Secondo il Parco il nero viene dalla sostanza organica e le venature dalla dolomitizzazione e dall'ossidazione. Si estraeva già in epoca romana, fu rilanciato nel Cinquecento e, sempre secondo il Parco, nel 1862 si contavano 30 cave, cinque delle quali sulla Palmaria.
  assertions:
    - po-descrizione
    - po-estrazione
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: «Da queste rocce viene il portoro» si regge su «cinque delle quali sulla Palmaria» (po-estrazione) e
  # sulle cave già citate in pa-contenuti. Se il dato del 1862 cade, riscrivere l'attacco con pa-contenuti.
- id: palmaria-context-portoro-en
  anchor: palmaria
  unitType: context
  locale: en
  audience: general
  durationS: 24
  text: These rocks give portoro, traditionally called marble but actually a black limestone with golden-yellow veins. According to the Park, the black comes from organic matter and the veins from dolomitisation and oxidation. It was already quarried in Roman times and revived in the 16th century; again according to the Park, there were 30 quarries in 1862, five of them on Palmaria.
  assertions:
    - po-descrizione
    - po-estrazione
  introduces: []
  requires: []
  hooks: []
- id: palmaria-detail-forti-it
  anchor: palmaria
  unitType: detail
  locale: it
  audience: general
  durationS: 22
  text: L'isola era anche un caposaldo militare. Il Forte Cavour, o Forte Palmaria, nasce da un'idea napoleonica del 1808, ripresa da un progetto piemontese tra il 1857 e il 1859. Secondo il Parco, la Batteria Umberto I, detta Fortezza del Mare, fu costruita dalla Regia Marina tra il 1887 e il 1889 per difendere il Golfo.
  assertions:
    - pa-forte-cavour
    - pa-batteria-umberto
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: 1889 o 1890 per la Batteria Umberto I. Se le fonti restano divergenti, aprire la controversia e dire
  # «tra il 1887 e la fine del decennio» oppure citare entrambe le date.
- id: palmaria-detail-forti-en
  anchor: palmaria
  unitType: detail
  locale: en
  audience: general
  durationS: 23
  text: The island was also a military stronghold. Fort Cavour, or Fort Palmaria, grew from a Napoleonic idea of 1808, taken up again in a Piedmontese project between 1857 and 1859. According to the Park, the Umberto I Battery, called the Fortress of the Sea, was built by the Royal Navy between 1887 and 1889 to defend the Gulf.
  assertions:
    - pa-forte-cavour
    - pa-batteria-umberto
  introduces: []
  requires: []
  hooks: []
- id: palmaria-detail-grotta-colombi-it
  anchor: palmaria
  unitType: detail
  locale: it
  audience: general
  durationS: 16
  text: In alto su una falesia della punta meridionale si apre la Grotta dei Colombi. Fu studiata da Giovanni Capellini nel 1869 e vi furono trovati strumenti in pietra, resti umani e resti di animali, anche di specie legate a climi freddi.
  assertions:
    - pa-grotta-colombi
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: Capellini e il 1869 non hanno conferme indirette. Il racconto non invita a raggiungere la grotta e non
  # deve farlo (nota di sicurezza del pacchetto, PV-009-C2).
- id: palmaria-detail-grotta-colombi-en
  anchor: palmaria
  unitType: detail
  locale: en
  audience: general
  durationS: 14
  text: High on a cliff at the southern tip lies the Grotta dei Colombi. It was studied by Giovanni Capellini in 1869, and stone tools, human remains and animal remains, including cold-climate species, were found there.
  assertions:
    - pa-grotta-colombi
  introduces: []
  requires: []
  hooks: []
- id: palmaria-context-mare-it
  anchor: palmaria
  unitType: context
  locale: it
  audience: general
  durationS: 19
  text: Anche il mare è protetto. L'area di tutela marina del Parco comprende la parte sud-occidentale della Palmaria, il Tino, il Tinetto e la prateria di Posidonia nel canale verso Porto Venere. Attenzione, però, sito UNESCO, Parco, aree Natura 2000 e area marina hanno confini e regole propri.
  assertions:
    - atm-perimetro
    - pa-tutele-distinte
  introduces: []
  requires: []
  hooks: []
- id: palmaria-context-mare-en
  anchor: palmaria
  unitType: context
  locale: en
  audience: general
  durationS: 19
  text: The sea is protected too. The Park's marine protection area includes south-western Palmaria, Tino, Tinetto and the Posidonia meadow in the channel towards Porto Venere. Note, though, that the UNESCO site, the Park, the Natura 2000 areas and the marine area each have their own boundaries and rules.
  assertions:
    - atm-perimetro
    - pa-tutele-distinte
  introduces: []
  requires: []
  hooks: []
- id: palmaria-detail-fondali-it
  anchor: palmaria
  unitType: detail
  locale: it
  audience: general
  durationS: 16
  text: Sotto la superficie ci sono pareti rocciose, grotte sommerse e semisommerse, gorgonie e coralligeno. Tra i siti d'immersione il Parco indica la Grotta del Tinetto, la Grotta Azzurra, la Grotta del Tino, la Grotta Byron e la Secca di Dante.
  assertions:
    - atm-fondali
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: nessuna indicazione operativa sulle immersioni (correnti, permessi): restano fuori dal pack.
- id: palmaria-detail-fondali-en
  anchor: palmaria
  unitType: detail
  locale: en
  audience: general
  durationS: 16
  text: Below the surface there are rock walls, submerged and partly submerged caves, gorgonians and coralligenous reefs. Among its dive sites the Park lists the Tinetto cave, the Blue Grotto, the Tino cave, Byron's Grotto and the Secca di Dante shoal.
  assertions:
    - atm-fondali
  introduces: []
  requires: []
  hooks: []
- id: palmaria-curiosity-capre-it
  anchor: palmaria
  unitType: curiosity
  locale: it
  audience: general
  durationS: 15
  text: Una storia curiosa riguarda le capre. Nel 2018 il Parco avviò un progetto per catturare e trasferire le capre inselvatichite dell'isola, per proteggere gli habitat del sito Natura 2000; le stime di allora parlavano di 80–100 animali.
  assertions:
    - pa-capre-2018
  introduces: []
  requires: []
  hooks: []
  # REVISIONE: il racconto non dice se le capre ci sono ancora, e non deve dirlo: la presenza attuale non è risolta.
- id: palmaria-curiosity-capre-en
  anchor: palmaria
  unitType: curiosity
  locale: en
  audience: general
  durationS: 15
  text: A curious story concerns the goats. In 2018 the Park started a project to capture and relocate the island's feral goats, to protect the habitats of the Natura 2000 site; estimates at the time spoke of 80–100 animals.
  assertions:
    - pa-capre-2018
  introduces: []
  requires: []
  hooks: []

